name: CDKless Deploy

on:
  push:
    branches:
      - main
      - testing
      - sandbox
    paths-ignore:
      - '.github/**'
      - '*.md'

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment: ${{ github.ref_name == 'main' && (vars.AWS_ACCOUNTS && fromJSON(vars.AWS_ACCOUNTS).training && 'training' || 'production') || github.ref_name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set AWS Role ARN
        id: set-role
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          ACCOUNTS=$(echo '${{ vars.AWS_ACCOUNTS }}' | jq -c .)


          if [ "$BRANCH" = "main" ]; then
            # Para main, usar training si existe, sino production
            if [ "$(echo "$ACCOUNTS" | jq -r '.training // empty')" != "" ]; then
              account=$(echo "$ACCOUNTS" | jq -r '.training')
              ENVIRONMENT="training"
            else
              account=$(echo "$ACCOUNTS" | jq -r '.production')
              ENVIRONMENT="production"
            fi
          else
            # Para otras ramas, usar el nombre de la rama
            account=$(echo "$ACCOUNTS" | jq -r --arg br "$BRANCH" '.[$br]')
            ENVIRONMENT="$BRANCH"
          fi

          echo "role_arn=arn:aws:iam::${account}:role/gh-${{ github.event.repository.name }}-role" >> $GITHUB_OUTPUT
          echo "stage=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Install layers dependencies
        run: |
          cd layers/common && npm install

      - name: Deploy with CDK
        uses: alegradev/alegra-actions/.github/actions/cdk-backend-deploy@v1.1.10
        with:
          aws-role-arn: ${{ steps.set-role.outputs.role_arn }}
          aws-region: us-east-1
          node-version: 24
          working-directory: .
          stage: ${{ steps.set-role.outputs.stage }}
        env:
          GITHUB_TOKEN: ${{ secrets.AL_NPM_TOKEN_CLOUD }}
          AWS_REGION_ID: us-east-1
          STAGE: ${{ steps.set-role.outputs.stage }}
          LAMBDA_AUTHORIZER_ARN: ${{ vars.LAMBDA_AUTHORIZER_ARN }}
          OUTBOX_TABLE_NAME: ${{ vars.OUTBOX_TABLE_NAME }}
          OUTBOX_INTEGRATION_TEST_TABLE_NAME: ${{ vars.OUTBOX_INTEGRATION_TEST_TABLE_NAME }}
          EXAMPLES_TABLE_NAME: ${{ vars.EXAMPLES_TABLE_NAME }}
          OUTBOX_TABLE_ARN: ${{ vars.OUTBOX_TABLE_ARN }}
          OUTBOX_TABLE_STREAM_ARN: ${{ vars.OUTBOX_TABLE_STREAM_ARN }}
          EXAMPLES_TABLE_ARN: ${{ vars.EXAMPLES_TABLE_ARN }}
          SNS_EXAMPLE_ENTITY_TOPIC_ARN: ${{ vars.SNS_EXAMPLE_ENTITY_TOPIC_ARN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
